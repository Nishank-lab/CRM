# Cloud-specific configuration profile
# Activate with: --spring.profiles.active=cloud

# Production-ready database configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Actuator security enabled
management.security.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Thymeleaf caching enabled for performance
spring.thymeleaf.cache=true

# Session management via Redis
spring.session.store-type=redis
spring.session.timeout=1800

# AWS CloudWatch metrics
management.metrics.export.cloudwatch.namespace=CRM-Application
management.metrics.export.cloudwatch.enabled=true
management.metrics.export.cloudwatch.batch-size=20

# AWS X-Ray tracing
aws.xray.enabled=true

# Security - require SSL in production
security.require-ssl=true
server.ssl.enabled=false

# PDF storage enabled for cloud
pdf.storage.enabled=true
