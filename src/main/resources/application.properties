# Cloud-native configuration using environment variables
# Database Configuration - Use AWS RDS endpoint
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/crm?useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

# HikariCP Connection Pool Configuration for Cloud
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}
spring.datasource.hikari.auto-commit=true

# Cloud-safe DDL mode - validate instead of create-drop
# Use 'none' in production with managed database migrations (Flyway/Liquibase)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5InnoDBDialect
spring.jpa.properties.hibernate.format_sql=false

# Actuator Security - ENABLED by default for cloud security
management.security.enabled=${ACTUATOR_SECURITY_ENABLED:true}
management.context-path=/actuator
management.endpoints.web.exposure.include=${ACTUATOR_ENDPOINTS:health,info,metrics}
management.endpoint.health.show-details=when-authorized

# Health Check Configuration for Cloud Load Balancers
management.health.defaults.enabled=true
management.health.db.enabled=true

# Thymeleaf Configuration - Modern HTML5 mode
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
spring.thymeleaf.encoding=UTF-8

# Server Configuration - Use environment variable for port
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,application/javascript,application/json

# Logging Configuration for Cloud (structured logging)
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.crm=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.web=${LOG_LEVEL_SPRING:WARN}
logging.level.org.hibernate=${LOG_LEVEL_HIBERNATE:WARN}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# AWS S3 Configuration for PDF Storage
aws.s3.bucket.name=${AWS_S3_BUCKET:crm-pdf-bucket}
aws.s3.region=${AWS_REGION:us-east-1}
pdf.storage.enabled=${PDF_STORAGE_ENABLED:false}

# Session Management - Use external store in production
spring.session.store-type=${SESSION_STORE_TYPE:none}
# For production: set SESSION_STORE_TYPE=redis and configure Redis connection

# Redis Configuration for Session Store (if enabled)
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}

# Security Configuration
security.require-ssl=${REQUIRE_SSL:false}
