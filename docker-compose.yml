version: '3.8'

services:
  crm-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: crm-db-check-comp:latest
    container_name: crm-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      - DDL_AUTO=validate
      - DB_URL=jdbc:mysql://mysql-host:3306/crm?useSSL=false
      - DB_USERNAME=root
      - DB_PASSWORD=password
      - MANAGEMENT_SECURITY_ENABLED=true
      - TZ=UTC
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/appinfo/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  app-network:
    driver: bridge
