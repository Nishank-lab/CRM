version: '3.8'

services:
  crm-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: crm-app:latest
    container_name: crm-app
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=${DB_HOST:-mysql-host}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-crm}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - TZ=UTC
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    networks:
      - crm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  crm-network:
    driver: bridge

volumes:
  logs:
  config: